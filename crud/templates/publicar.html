{% extends "layout.html" %}
{% block body %}
<a href="{{ url_for('index') }}" class="btn btn-secondary mb-3">Atrás</a>

<div class="card card-body">
  <form method="POST" action="{{ url_for('publicar') }}">
    
    <!-- Modo -->
    <div class="mb-3">
      <label for="modo" class="form-label">Modo</label>
      <select class="form-select" id="modo" name="modo" required onchange="toggleSetpoint(this)">
        <option value="" disabled selected>Seleccionar modo</option>
        <option value="destello">Destello</option>
        <option value="setpoint">Setpoint</option>
      </select>
    </div>

    <!-- Setpoint (solo si elige setpoint) -->
    <div class="mb-3" id="setpointGroup" style="display: none;">
      <label for="setpoint" class="form-label">Setpoint</label>
      <input 
        type="number" 
        step="0.1" 
        min="0"
        class="form-control" 
        name="setpoint" 
        id="setpoint"
        placeholder="Ingrese el valor de setpoint">
    </div>

    <!-- Nodo -->
    <div class="mb-3">
      <label for="nodo" class="form-label">Nodo</label>
      <select class="form-select" name="nodo" id="nodo" required>
        {% for nodo in nodos %}
          <option value="{{ nodo[0] }}">{{ nodo[0] }}</option>
        {% endfor %}
      </select>
    </div>

    <!-- Botón -->
    <button type="submit" class="btn btn-primary">Publicar</button>
  </form>
</div>

<!-- Script para mostrar/ocultar setpoint -->
<script>
  function toggleSetpoint(select) {
    const group = document.getElementById("setpointGroup");
    group.style.display = select.value === "setpoint" ? "block" : "none";
  }

  // Ejecutar al cargar si ya hay un valor seleccionado (por ejemplo, tras un error)
  document.addEventListener("DOMContentLoaded", () => {
    const modo = document.getElementById("modo");
    toggleSetpoint(modo);
  });
</script>
{% endblock %}
