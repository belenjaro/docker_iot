<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>FLASK CRUD 1.6</title>
</head>

<body>
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-success alert-dismissible fade show" role="alert">
          <strong>{{ message }}</strong>
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">CRUD</a>
      {% if session.get("user_id") %}
      <div class="d-flex align-items-center">
        <div class="nav-item text-white pe-3">{{ session.get("user_id") }}</div>

        <!-- Selector de tema -->
        <select id="themeSelector" class="form-select form-select-sm me-3">
          <option value="light">Claro</option>
          <option value="dark">Oscuro</option>
        </select>

        <a href="{{ url_for('logout') }}" class="btn btn-secondary btn-sm">Salir</a>
      </div>
      {% endif %}
    </div>
  </nav>

  <div class="container pt-4">
    {% block body %}{% endblock %}
  </div>

  <!-- Bootstrap bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>

  <!-- Script para manejo de temas -->
  <script>
    const themeSelector = document.getElementById('themeSelector');

    function applyTheme(theme) {
      const head = document.head;
      const oldLink = document.getElementById('theme-stylesheet');
      if (oldLink) head.removeChild(oldLink);

      const link = document.createElement('link');
      link.id = 'theme-stylesheet';
      link.rel = 'stylesheet';
      link.href = theme === 'dark'
        ? 'https://bootswatch.com/5/slate/bootstrap.min.css'  // Tema oscuro
        : 'https://bootswatch.com/5/cosmo/bootstrap.min.css'; // Tema claro por defecto

      head.appendChild(link);
      localStorage.setItem('theme', theme);
      if (themeSelector) themeSelector.value = theme;
    }

    document.addEventListener('DOMContentLoaded', () => {
      const savedTheme = localStorage.getItem('theme') || 'light'; // Tema claro por defecto
      applyTheme(savedTheme);

      if (themeSelector) {
        themeSelector.value = savedTheme;
        themeSelector.addEventListener('change', () => {
          applyTheme(themeSelector.value);
        });
      }
    });
  </script>
</body>

</html>
